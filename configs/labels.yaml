# 首个训练标签（已确认）
primary:
  name: mortality_12h
  horizon_hours: 12
  # Window starts at prediction time t=intime+features.prediction_offset_hours (S1)
  event: death_from_prediction_time
  note: "S1/S2 label in [t, t+12h]; prefer admissions.deathtime over date-level dod"
  death_time_prefer: deathtime   # deathtime | dod
  label_version: mortality_12h_v2_deathtime

horizons_hours: [4, 8, 12, 24]

split:
  train: 0.7
  val: 0.1
  test: 0.2
  by: stay_id
  seed: 42
  # Must keep three folds separate — do NOT merge val into test.

recommend:
  observe: 0.2
  recheck: 0.4
  monitor: 0.7
