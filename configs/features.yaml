# S2 streaming early-warning: samples at multiple prediction times t=intime+h
task: mortality_12h
hour_index: 1                    # default for single-stay predict API
prediction_offset_hours: 1       # legacy alias / default if grid absent
prediction_hours: [0, 1, 2, 4, 6]  # S2 grid (hours after intime)
anchor: icu_intime

allowed:
  - anchor_age
  - careunit_other
  - vital_temp
  - vital_gcs_total
  - vital_fio2
  - vital_heart_rate
  - vital_nbps
  - vital_resp_rate
  - lab_lactate
  - lab_bun
  - lab_ph
  - lab_potassium
  - lab_inr
  - lab_albumin
  - pre_icu_los_hours
  - gcs_total
  - vasopressor_1h
  - shock_index
  - spo2_fio2_ratio

denied:
  - hospital_expire_flag
  - los_hours
  - dod
  - outtime

notes: |
  S2: one row per (stay_id, hour_index) for each h in prediction_hours.
  Features: charttime < intime+h (pre-ICU labs preferred).
  Label: death in [intime+h, intime+h+12h].
  Split: by stay_id (all hours of a stay in the same fold).
  h=0 ≈ admission/pre-ICU only (post-intime window empty).
