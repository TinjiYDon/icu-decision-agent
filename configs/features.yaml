# Feature contract for mortality_12h (admission-time / hour_index=0)
# Owner: C maintains allow/deny; B must not add denied columns without Issue.

task: mortality_12h
hour_index: 0
anchor: icu_intime

allowed:
  - anchor_age
  - gender_m
  - careunit_micu
  - careunit_sicu
  - careunit_ccu
  - careunit_other

