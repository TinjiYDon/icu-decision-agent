# Temporal / GRU-D settings (research track; LightGBM remains deployable baseline)
# feature_keys order MUST match domain.models.temporal.attribution.FEATURE_NAMES
# and train_grud._itemids_for_features().
temporal:
  model: grud
  # Sliding lookback ending at prediction time t (hours). 0 = expanding window [intime, t).
  lookback_hours: 6
  # Recency weight: w(delta_h) = exp(-lambda * delta_h); 0 disables.
  recency_lambda: 0.15
  max_timesteps: 12
  feature_keys:
    - hr
    - sbp
    - lactate
    - creatinine
    - resp_rate
    - temperature
    - spo2
    - bun
  # Sparse window: drop stays below thresholds (D1)
  min_obs_ratio: 0.05
  min_observed_cells: 3
  require_any_vital: true
  vital_keys:
    - hr
    - sbp
    - spo2
    - resp_rate
    - temperature
  hidden_size: 64
  dropout: 0.1
  epochs: 20
  batch_size: 64
  lr: 0.001
  # Prefer LGBM stay split manifest when present (same-split对照)
  use_lgbm_split_manifest: true
  split_seed: 42
  sequence_cache_dir: artifacts/sequences
